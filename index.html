<!DOCTYPE html>
<html lang="en">
    <head>
         <!-- Gör så att sidan kan visa olika tecken rätt -->
         <meta charset="UTF-8">
         <!-- Anpassar sidan efter skärmens storlek -->
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <!-- Namnet som visas på webbläsarens flik -->
         <title>European Elite Fantasy League (EEFL)</title>
         <!-- Kopplar HTML till CSS-filen -->
         <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--Skapar en wrapper som håller allt centerad-->
        <div id="wrapper">
            <!--Skapar top delen, den mörkblåa då-->
            <div id="top">
                <!--top left sida av hemsidan-->
                <div id="top-left">
                    <!--Jag har gjort style på min logo eftersom att jag inte hitta ett sätt att styla den i css, den ville inte lyssna-->
                    <img src="logo.png" alt="EEFL Logo" style="width: 100px; height: auto; vertical-align: top; float: left; margin-right: 7px;">
                    <p>European Elite Fantasy League</p>
                </div>
                <!--top right sida av hemsidan-->
                <div id="top-right">
                    <span class="divider">|</span>
                    <a href="#">TABLE</a>
                    <span class="divider">|</span>
                    <a href="#">MATCH</a>
                    <span class="divider">|</span>
                    <a href="#">RULES</a>
                    <span class="divider">|</span>
                </div>
            </div>
        </div>
        <!--allt som är under top delen-->
        <div id="header">
            <div id="header-background">
                <h1 id="header-text">European Elite Fantasy League</h1>
                <h2 id="header-text2">The best teams. One league</h2>
            </div>
        </div>
    </body>
</html>
